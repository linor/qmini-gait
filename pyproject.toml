[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stylized-gait"
version = "0.1.0"
description = "Procedural stylized walking gaits for the QMini biped (Hopkins et al., ACM TOG 2024)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
usd = ["usd-core>=23.11"]        # Blender round-trip: reads .usdc, composes xform ops
plot = ["matplotlib>=3.6"]       # docs figures
isaac = ["torch>=2.0"]           # the Isaac Lab reference player
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
